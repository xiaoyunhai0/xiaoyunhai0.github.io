<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1eb">
    <meta
      name="description"
      content="霄云海的网页小游戏合集，打开即玩。"
    >
    <title>游戏室 | 霄云海的博客</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f9fe;
        --surface: #ffffff;
        --ink: #1f2d3d;
        --muted: #687582;
        --line: #e3e8f0;
        --red: #ed4b4b;
        --green: #25805f;
        --cyan: #288d9a;
        --blue: #425aef;
        --shadow: 0 12px 30px rgba(42, 39, 32, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0;
      }

      a {
        color: inherit;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(247, 249, 254, 0.94);
        backdrop-filter: blur(14px);
      }

      .site-header__inner {
        width: min(1080px, calc(100% - 40px));
        min-height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 750;
        text-decoration: none;
      }

      .brand__avatar {
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 50%;
        object-fit: cover;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .site-nav a {
        padding: 8px 11px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }

      .site-nav a:hover,
      .site-nav a[aria-current="page"] {
        background: var(--surface);
        color: var(--ink);
      }

      .site-nav a[aria-current="page"] {
        box-shadow: inset 0 -2px var(--blue);
      }

      main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 68px 0 80px;
      }

      .intro {
        max-width: 720px;
        margin-bottom: 46px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 620px;
        font-size: 52px;
        line-height: 1.08;
        font-weight: 850;
        letter-spacing: 0;
      }

      .intro p:last-child {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
        gap: 22px;
      }

      .game-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .game-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 38px rgba(42, 39, 32, 0.15);
      }

      .game-card__link {
        display: block;
        text-decoration: none;
      }

      .game-card__visual {
        position: relative;
        min-height: 230px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: #dfece6;
      }

      .game-card__visual--neon {
        background: #071014;
        color: #67e8f9;
      }

      .neon-grid {
        position: absolute;
        inset: 0;
        opacity: 0.25;
        background-image:
          linear-gradient(rgba(103, 232, 249, 0.34) 1px, transparent 1px),
          linear-gradient(90deg, rgba(103, 232, 249, 0.34) 1px, transparent 1px);
        background-size: 30px 30px;
      }

      .quarantine-map {
        position: relative;
        width: 174px;
        height: 126px;
        border: 2px solid currentColor;
        border-radius: 6px;
        background: #0d1b21;
        box-shadow:
          0 0 26px rgba(103, 232, 249, 0.22),
          18px 16px 0 rgba(255, 105, 212, 0.1);
      }

      .quarantine-map::before,
      .quarantine-map::after {
        content: "";
        position: absolute;
        background: #26383d;
      }

      .quarantine-map::before {
        left: 47px;
        top: 0;
        width: 18px;
        height: 82px;
      }

      .quarantine-map::after {
        right: 0;
        bottom: 28px;
        width: 92px;
        height: 16px;
      }

      .relay,
      .operator,
      .extraction {
        position: absolute;
        z-index: 1;
      }

      .relay {
        width: 12px;
        height: 12px;
        border: 2px solid #ffd166;
        border-radius: 50%;
        box-shadow: 0 0 10px #ffd166;
      }

      .relay--one {
        left: 20px;
        top: 22px;
      }

      .relay--two {
        right: 28px;
        top: 28px;
      }

      .relay--three {
        left: 79px;
        bottom: 18px;
      }

      .operator {
        left: 68px;
        top: 49px;
        width: 15px;
        height: 15px;
        transform: rotate(45deg);
        border: 2px solid #fff;
        background: var(--cyan);
        box-shadow: 0 0 12px var(--cyan);
      }

      .extraction {
        right: 13px;
        bottom: 11px;
        width: 34px;
        height: 34px;
        border: 2px dashed #71f6b3;
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(113, 246, 179, 0.6);
      }

      .signal {
        position: relative;
        width: 128px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 16px solid #f7f4ed;
        border-radius: 50%;
        background: var(--red);
        box-shadow:
          0 0 0 2px var(--ink),
          0 18px 0 rgba(32, 33, 31, 0.12);
      }

      .signal::after {
        content: "";
        width: 32px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
      }

      .speed-lines {
        position: absolute;
        inset: 0;
        opacity: 0.34;
        background: repeating-linear-gradient(
          105deg,
          transparent 0 42px,
          var(--cyan) 43px 45px,
          transparent 46px 76px
        );
      }

      .game-card__content {
        padding: 22px;
      }

      .game-card__meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
      }

      .game-card h2 {
        margin: 0;
        font-size: 23px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .game-card p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .play {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
      }

      .play__icon {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 11px;
      }

      footer {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 22px 0 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .site-header__inner,
        main,
        footer {
          width: min(100% - 28px, 1080px);
        }

        .site-nav__optional {
          display: none;
        }

        .site-nav a {
          padding-inline: 9px;
        }

        main {
          padding-top: 44px;
        }

        h1 {
          font-size: 38px;
        }

        .intro p:last-child {
          font-size: 15px;
        }

        .game-card__visual {
          min-height: 200px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="返回霄云海的博客">
          <img class="brand__avatar" src="/img/avatar.png" alt="">
          <span class="brand__text">霄云海的博客</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a class="site-nav__optional" href="/archives/">归档</a>
          <a class="site-nav__optional" href="/categories/">分类</a>
          <a class="site-nav__optional" href="/tags/">标签</a>
          <a href="/games/" aria-current="page">游戏室</a>
          <a class="site-nav__optional" href="/music/">音乐馆</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Game archive / 02 titles</p>
        <h1 id="page-title">游戏室</h1>
        <p>不用下载，不用登录。挑一个小游戏，给大脑换个频道。</p>
      </section>

      <section class="game-grid" aria-label="游戏列表">
        <article class="game-card">
          <a class="game-card__link" href="./neon-quarantine/">
            <div
              class="game-card__visual game-card__visual--neon"
              aria-hidden="true"
            >
              <div class="neon-grid"></div>
              <div class="quarantine-map">
                <span class="relay relay--one"></span>
                <span class="relay relay--two"></span>
                <span class="relay relay--three"></span>
                <span class="operator"></span>
                <span class="extraction"></span>
              </div>
            </div>
            <div class="game-card__content">
              <div class="game-card__meta">
                <span>肉鸽射击</span>
                <span>桌面端 · 键鼠</span>
              </div>
              <h2>霓虹隔离区：撤离协议</h2>
              <p>激活三座能源中继站，突破封锁区并坚持到撤离信标解锁。</p>
              <span class="play">
                <span class="play__icon" aria-hidden="true">▶</span>
                进入隔离区
              </span>
            </div>
          </a>
        </article>

        <article class="game-card">
          <a class="game-card__link" href="./reaction/">
            <div class="game-card__visual" aria-hidden="true">
              <div class="speed-lines"></div>
              <div class="signal"></div>
            </div>
            <div class="game-card__content">
              <div class="game-card__meta">
                <span>反应速度</span>
                <span>约 30 秒</span>
              </div>
              <h2>反应力挑战</h2>
              <p>等待信号变绿，在最短时间内点下去。</p>
              <span class="play">
                <span class="play__icon" aria-hidden="true">▶</span>
                开始游戏
              </span>
            </div>
          </a>
        </article>
      </section>
    </main>

    <footer>© 2026 霄云海的博客</footer>
  </body>
</html>
