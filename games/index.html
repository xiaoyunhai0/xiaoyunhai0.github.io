<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1eb">
    <meta
      name="description"
      content="霄云海的网页小游戏合集，打开即玩。"
    >
    <title>游戏室 | 霄云海的博客</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f1eb;
        --surface: #fffdf8;
        --ink: #20211f;
        --muted: #686961;
        --line: #d8d5cc;
        --red: #e84b3c;
        --green: #177b57;
        --cyan: #2f8992;
        --shadow: 0 12px 30px rgba(42, 39, 32, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0;
      }

      a {
        color: inherit;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: rgba(244, 241, 235, 0.94);
      }

      .site-header__inner {
        width: min(1080px, calc(100% - 40px));
        min-height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 750;
        text-decoration: none;
      }

      .brand__mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 2px solid var(--ink);
        border-radius: 6px;
        background: var(--surface);
        font-size: 17px;
      }

      .back-link {
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--ink);
      }

      main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 68px 0 80px;
      }

      .intro {
        max-width: 720px;
        margin-bottom: 46px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--green);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 620px;
        font-size: 52px;
        line-height: 1.08;
        font-weight: 850;
        letter-spacing: 0;
      }

      .intro p:last-child {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
        gap: 22px;
      }

      .game-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .game-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 38px rgba(42, 39, 32, 0.15);
      }

      .game-card__link {
        display: block;
        text-decoration: none;
      }

      .game-card__visual {
        position: relative;
        min-height: 230px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: #dce7de;
      }

      .signal {
        position: relative;
        width: 128px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 16px solid #f7f4ed;
        border-radius: 50%;
        background: var(--red);
        box-shadow:
          0 0 0 2px var(--ink),
          0 18px 0 rgba(32, 33, 31, 0.12);
      }

      .signal::after {
        content: "";
        width: 32px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
      }

      .speed-lines {
        position: absolute;
        inset: 0;
        opacity: 0.34;
        background: repeating-linear-gradient(
          105deg,
          transparent 0 42px,
          var(--cyan) 43px 45px,
          transparent 46px 76px
        );
      }

      .game-card__content {
        padding: 22px;
      }

      .game-card__meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
      }

      .game-card h2 {
        margin: 0;
        font-size: 23px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .game-card p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .play {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
      }

      .play__icon {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 11px;
      }

      footer {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 22px 0 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .site-header__inner,
        main,
        footer {
          width: min(100% - 28px, 1080px);
        }

        .brand__text {
          display: none;
        }

        main {
          padding-top: 44px;
        }

        h1 {
          font-size: 38px;
        }

        .intro p:last-child {
          font-size: 15px;
        }

        .game-card__visual {
          min-height: 200px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="返回霄云海的博客">
          <span class="brand__mark" aria-hidden="true">◆</span>
          <span class="brand__text">霄云海的博客</span>
        </a>
        <a class="back-link" href="/">← 返回博客</a>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Browser games</p>
        <h1 id="page-title">游戏室</h1>
        <p>不用下载，不用登录。挑一个小游戏，给大脑换个频道。</p>
      </section>

      <section class="game-grid" aria-label="游戏列表">
        <article class="game-card">
          <a class="game-card__link" href="./reaction/">
            <div class="game-card__visual" aria-hidden="true">
              <div class="speed-lines"></div>
              <div class="signal"></div>
            </div>
            <div class="game-card__content">
              <div class="game-card__meta">
                <span>反应速度</span>
                <span>约 30 秒</span>
              </div>
              <h2>反应力挑战</h2>
              <p>等待信号变绿，在最短时间内点下去。</p>
              <span class="play">
                <span class="play__icon" aria-hidden="true">▶</span>
                开始游戏
              </span>
            </div>
          </a>
        </article>
      </section>
    </main>

    <footer>© 2026 霄云海的博客</footer>
  </body>
</html>
